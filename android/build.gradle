import java.nio.file.Paths

static def findNodeModules(baseDir) {
  def basePath = baseDir.toPath().normalize()
  // Node's module resolution algorithm searches up to the root directory,
  // after which the base path will be null
  while (basePath) {
    def nodeModulesPath = Paths.get(basePath.toString(), "node_modules")
    def reactNativePath = Paths.get(nodeModulesPath.toString(), "react-native")
    if (nodeModulesPath.toFile().exists() && reactNativePath.toFile().exists()) {
      return nodeModulesPath.toString()
    }
    basePath = basePath.getParent()
  }
  throw new GradleException("JSI-WS: Failed to find node_modules/ path!")
}

def nodeModules = findNodeModules(projectDir)
logger.warn("JSI-WS: node_modules/ found at: ${nodeModules}")

buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  repositories {
    google()
    mavenCentral()
    maven {
      url "https://plugins.gradle.org/m2/"
    }
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:4.2.2'
  }
}

apply plugin: 'com.android.library'

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['RandomValuesJsiHelper_' + name]
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a"]
}

def resolveNdkDirectory(ndkVersion) {
  def localPropertiesFile = rootProject.file("local.properties")
  if (!localPropertiesFile.exists()) {
    return null
  }
  def localProperties = new Properties()
  localPropertiesFile.withInputStream { localProperties.load(it) }
  def sdkDir = localProperties.getProperty("sdk.dir")
  if (sdkDir == null) {
    return null
  }
  def candidate = new File(sdkDir, "ndk/${ndkVersion}")
  if (!candidate.exists()) {
    return null
  }
  def sourceProperties = new File(candidate, "source.properties")
  if (sourceProperties.exists()) {
    return candidate
  }
  def nestedWithSource = candidate.listFiles()?.find { new File(it, "source.properties").exists() }
  return nestedWithSource
}

def configuredNdkVersion = getExtOrDefault('ndkVersion')
def resolvedNdk = resolveNdkDirectory(configuredNdkVersion)
if (resolvedNdk != null && resolvedNdk.exists()) {
  rootProject.ext.ndkPath = resolvedNdk.absolutePath
  System.setProperty("ndk.dir", resolvedNdk.absolutePath)
  logger.warn("JSI-WS: Using resolved NDK path: ${resolvedNdk.absolutePath}")
} else {
  logger.warn("JSI-WS: Could not resolve embedded NDK path for version ${configuredNdkVersion}, falling back to default lookup.")
}

android {
  namespace "com.reactnativejsicpr"

  buildFeatures {
    prefab true
  }
  compileSdkVersion safeExtGet('compileSdkVersion', 30)
  buildToolsVersion safeExtGet('buildToolsVersion', '30.0.0')
  ndkVersion configuredNdkVersion
  if (resolvedNdk != null && resolvedNdk.exists()) {
    ndkPath resolvedNdk.absolutePath
  }

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion safeExtGet('targetSdkVersion', 30)

    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared',
                  '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
      }
    }
    ndk {
      abiFilters (*reactNativeArchitectures())
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  sourceSets {
    main {
      java.srcDirs += ["generated/java"]
    }
  }

  packagingOptions {
    // Exclude all Libraries that are already present in the user's app (through React Native or by him installing REA)
    excludes = [
            "**/libc++_shared.so",
            "**/libfbjni.so",
            "**/libreactnativejni.so",
            "**/libjsi.so",
            "**/libreact_nativemodule_core.so",
            "**/libturbomodulejsijni.so",
            "**/libreactnative.so",
            "**/MANIFEST.MF",
            ""
    ]
    exclude "META-INF/**"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable 'GradleCompatible'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation 'io.github.vvb2060.ndk:curl:8.12.0-lto-ndk28'

  implementation "com.facebook.react:react-android:"
  implementation "com.facebook.react:hermes-android:"
}
